# Real-deployment stack for Portainer (Stacks → Add stack → Repository,
# compose path: portainer-stack.yml). Points at your existing Postgres
# instead of spinning up a throwaway one — see README.md.
#
# Fill in DATABASE_URL and MANAGER_EMAILS as Portainer stack environment
# variables (not hardcoded here), so you can edit MANAGER_EMAILS later
# without touching this file.
services:
  listener:
    build:
      context: .
      args:
        # Must match the address this service is actually reached at — the
        # self-signed cert's SAN is baked in at build time (see Dockerfile).
        # Changing this requires a rebuild, not just a redeploy.
        CERT_SAN_IP: ${CERT_SAN_IP:-192.168.86.205}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MANAGER_EMAILS: ${MANAGER_EMAILS}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: '8080'
    ports:
      - '${HOST_PORT:-8080}:8080'
    restart: unless-stopped
